name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip redundant CI on staging when Dependabot PR already passed checks
    # (Dependabot targets staging, so merges show author as dependabot[bot])
    if: |
      github.event_name == 'pull_request' ||
      github.ref != 'refs/heads/staging' ||
      github.event.head_commit.author.username != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install uv
        run: pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Python dependencies
        run: uv sync

      - name: Run lint
        run: npm run lint

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Run PHP tests
        run: npm run test:php

      - name: Run shell script tests
        run: npm run test:scripts
