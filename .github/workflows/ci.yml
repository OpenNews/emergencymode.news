name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-24.04
    # Skip redundant CI on staging when Dependabot PR already passed checks
    # (Dependabot targets staging, so merges show author.name as dependabot[bot])
    if: |
      github.event_name == 'pull_request' ||
      github.ref != 'refs/heads/staging' ||
      github.event.head_commit.author.name != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          php-coverage: xdebug

      - name: Run lint
        run: npm run lint

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Run PHP tests
        run: npm run test:php

      - name: Run shell script tests
        run: npm run test:scripts
