name: "CodeQL"

# Intentionally manual-trigger-only (workflow_dispatch) to control Action
# minute usage/billing. Do not add push/pull_request/schedule triggers
# without explicit sign-off — see repo billing constraints.
on:
  workflow_dispatch:

  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  analyze:
    if: vars.ENABLE_CODEQL_ADVANCED == 'true'
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
