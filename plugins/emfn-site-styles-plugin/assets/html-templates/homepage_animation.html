<script>
  (function () {
    const isInIframe = window.self !== window.top;
    const isDebug = new URLSearchParams(window.location.search).get("emfnDebug") === "true";
    if (isInIframe) {
      console.debug("Running in iframe, skipping animation");
      return;
    }

    const HOLD = 5400; //ms to hold each word before transitioning to the next

    // Lite-site signals, checked directly: this block can run before the site-styles
    // plugin JS has set its body classes (the battery one is async).
    const prefersStill = () => {
      const conn = navigator.connection ?? navigator.mozConnection ?? navigator.webkitConnection;
      return (
        window.matchMedia?.("(prefers-reduced-motion: reduce)").matches === true ||
        window.matchMedia?.("(prefers-reduced-data: reduce)").matches === true ||
        conn?.saveData === true
      );
    };

    // Same rule as the site-styles plugin: 20% or lower and not charging
    const isLowBattery = async () => {
      if (typeof navigator.getBattery !== "function") return false;
      try {
        const battery = await navigator.getBattery();
        return Number.isFinite(battery?.level) && battery.level <= 0.2 && battery.charging !== true;
      } catch {
        return false;
      }
    };

    const start = async () => {
      const words = document.querySelectorAll(".emfn-word");
      if (!words.length) {
        if (isDebug) console.debug("No .emfn-word elements found");
        return;
      }

      if (prefersStill() || (await isLowBattery())) {
        if (isDebug) console.debug("Lite-site signal present, skipping animation");
        return;
      }

      // One rotation: show each word once, then settle back on the first and stop
      let idx = 0;
      const step = () => {
        if (prefersStill()) return;
        words[idx].classList.remove("emfn-active");
        idx = (idx + 1) % words.length;
        words[idx].classList.add("emfn-active");
        if (idx !== 0) setTimeout(step, HOLD);
      };
      setTimeout(step, HOLD);
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }
  })();
</script>
<style>
  #emfn-hero-h1 {
    background-color: transparent;
    font-size: clamp(2.25rem, 5vw, 3.5rem);
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
  }

  #emfn-hero-h1 {
    margin-left: auto;
    margin-right: auto;
  }

  .emfn-word-backup {
    pointer-events: none;
    visibility: hidden;
  }
  #emfn-disaster-wrap {
    color: var(--newspack-primary-color);
    display: block;
    height: 1.3em; /* reserves space for one line */
    position: relative;
    text-align: center;
  }
  .emfn-word {
    color: var(--newspack-primary-color);
    left: 0;
    right: 0;
    opacity: 0;
    pointer-events: none;
    position: absolute;
    text-align: center;
    transition: opacity 10ms ease-in-out;
  }
  .emfn-active {
    color: var(--wp--preset--color--primary);
    opacity: 1;
  }
  /* visually hidden, still read by screen readers */
  .emfn-sr-only {
    border: 0;
    clip-path: inset(50%);
    height: 1px;
    margin: -1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    white-space: nowrap;
    width: 1px;
  }
</style>
<!-- Rotating words are aria-hidden so screen readers hear one stable heading -->

    <span aria-hidden="true" class="emfn-word">a&nbsp;tornado</span>

  </span>
</h1>
